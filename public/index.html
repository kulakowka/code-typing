<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Typing — тренажёр слепой печати кода</title>
<meta name="description" content="Тренажёр слепой печати для программистов: печатай настоящий код на JS, TS, Python, Go, SQL, Bash.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1c1e;--panel:#252528;--ink:#f2efe8;--dim:#6e6c68;--ok:#f2efe8;--bad:#ff5f56;--acc:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header,footer{padding:16px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font:700 18px 'JetBrains Mono',monospace;margin:0 auto 0 0}
header h1 span{color:var(--acc)}
select,button{background:var(--panel);color:var(--ink);border:1px solid #3a3a3e;border-radius:8px;padding:8px 12px;font:14px Inter,sans-serif;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:16px}
.stats{display:flex;gap:24px;font:14px 'JetBrains Mono',monospace;color:var(--dim);margin-bottom:12px}
.stats b{color:var(--acc);font-size:22px;display:block}
#code{background:var(--panel);border-radius:12px;padding:24px;font:18px/1.6 'JetBrains Mono',monospace;white-space:pre;overflow-x:auto;outline:none;position:relative;min-height:200px;cursor:text}
#code,#code *{font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}#code .t{opacity:.38}#code .k{color:#c792ea}#code .s{color:#c3e88d}#code .c{color:#7f8c98;font-style:italic}#code .n{color:#f78c6c}#code .f{color:#82aaff}#code .p{color:#89ddff}#code .bad{color:var(--bad)!important;opacity:1}#code .bad{background:#ff5f5622;border-radius:2px}
#code .cur{border-left:2px solid var(--acc);margin-left:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{border-color:transparent}}
#code .nl::after{content:'↵';color:#ffffff22}
#hint{color:var(--dim);font-size:14px;margin-top:12px}
#result{display:none;background:var(--panel);border-radius:12px;padding:24px;margin-top:16px;text-align:center}
#result h2{font:700 28px 'JetBrains Mono',monospace;color:var(--acc);margin:0 0 8px}
#hist{font:13px 'JetBrains Mono',monospace;color:var(--dim);margin-top:16px}
footer{color:var(--dim);font-size:13px;justify-content:center}
footer a{color:var(--acc)}

#kb{margin-top:16px;display:flex;flex-direction:column;gap:5px;align-items:center;user-select:none}
.row{display:flex;gap:5px}
.key{width:42px;height:42px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:13px 'JetBrains Mono',monospace;color:#f2efe8cc;background:color-mix(in srgb,var(--fc) 22%,#252528);border-bottom:3px solid color-mix(in srgb,var(--fc) 55%,#252528);transition:transform .08s}
.key.w15{width:66px}.key.w2{width:86px}.key.w25{width:100px}.key.sp{width:280px}
.key.on{background:var(--fc);color:#1c1c1e;font-weight:700;transform:translateY(-2px);box-shadow:0 0 0 2px #fff,0 0 18px var(--fc)}
.key.home::after{content:'';position:absolute;margin-top:26px;width:10px;height:2px;background:#f2efe866;border-radius:1px}
#hands{display:flex;justify-content:center;gap:32px;margin-top:14px;font:13px Inter,sans-serif;color:var(--dim)}
.hand{display:flex;gap:6px;align-items:flex-end}
.fg{width:22px;border-radius:11px 11px 6px 6px;background:color-mix(in srgb,var(--fc) 14%,#2c2c30);transition:all .1s}
.fg.on{background:var(--fc);box-shadow:0 0 14px var(--fc);transform:translateY(-6px)}
#finger{text-align:center;margin-top:10px;font:600 15px Inter,sans-serif;min-height:20px}
#kbtoggle{margin-left:8px}
@media(max-width:760px){#kb,#hands{display:none!important}}
@media(max-width:600px){#code{font-size:14px;padding:16px}.stats{gap:14px}}
</style>
</head>
<body>
<header>
<h1>code<span>_</span>typing</h1>
<select id="lang"></select>
<button id="kbtoggle">⌨︎ Подсказка</button>
<button id="next">Другой код ⟳</button>
</header>
<main>
<div class="stats"><div><b id="wpm">0</b>WPM</div><div><b id="acc">100%</b>точность</div><div><b id="time">0s</b>время</div><div><b id="err">0</b>ошибок</div></div>
<div id="code" tabindex="0"></div>
<div id="kbwrap"><div id="kb"></div><div id="hands"></div><div id="finger"></div></div>
<div id="hint">Кликни по коду и печатай. Отступы ставятся сами. Пальцы на F и J (там засечки). Enter — перенос, Tab — ничего, Esc — заново.</div>
<div id="result"><h2 id="rtitle"></h2><div id="rtext"></div><p><button id="again">Ещё раз ⟳</button></p></div>
<div id="hist"></div>
</main>
<footer>Сделал <a href="https://antonkulakov.com">Антон Кулаков</a> · <a href="https://www.youtube.com/@antonkulakovcom">YouTube</a> · <a href="https://t.me/antonkulakovcom">Telegram</a></footer>
<script>
const S={
JavaScript:[
`function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}`,
`const users = await fetch('/api/users')
  .then((res) => res.json())
  .catch(() => []);
const active = users.filter((u) => u.isActive);`,
`export function groupBy(items, key) {
  return items.reduce((acc, item) => {
    (acc[item[key]] ||= []).push(item);
    return acc;
  }, {});
}`,
`app.get('/health', (req, res) => {
  res.json({ ok: true, uptime: process.uptime() });
});`],
TypeScript:[
`interface User {
  id: string;
  email: string;
  roles?: Array<'admin' | 'user'>;
}`,
`export async function retry<T>(fn: () => Promise<T>, n = 3): Promise<T> {
  try {
    return await fn();
  } catch (e) {
    if (n <= 0) throw e;
    return retry(fn, n - 1);
  }
}`,
`type Result<T, E = Error> =
  | { ok: true; value: T }
  | { ok: false; error: E };`],
Python:[
`def fib(n: int) -> int:
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a`,
`with open("data.csv") as f:
    rows = [line.strip().split(",") for line in f]
print(f"rows: {len(rows)}")`,
`@app.get("/items/{item_id}")
async def read_item(item_id: int, q: str | None = None):
    return {"item_id": item_id, "q": q}`],
Go:[
`func handler(w http.ResponseWriter, r *http.Request) {
	w.Header().Set("Content-Type", "application/json")
	json.NewEncoder(w).Encode(map[string]bool{"ok": true})
}`,
`for i, v := range items {
	if err := process(v); err != nil {
		return fmt.Errorf("item %d: %w", i, err)
	}
}`],
SQL:[
`SELECT u.email, COUNT(o.id) AS orders
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE u.created_at > NOW() - INTERVAL '30 days'
GROUP BY u.email
ORDER BY orders DESC
LIMIT 10;`,
`CREATE INDEX CONCURRENTLY idx_orders_user
ON orders (user_id, created_at DESC);`],
Bash:[
`for f in *.mp4; do
  ffmpeg -i "$f" -vn -ac 1 "\${f%.mp4}.wav"
done`,
`git log --oneline --since="1 week ago" | wc -l`,
`docker run --rm -p 8080:80 -v "$PWD":/usr/share/nginx/html nginx:alpine`]};

const KW={JavaScript:'const let var function return async await if else for of in while new class export import from try catch throw true false null undefined typeof',
TypeScript:'const let var function return async await if else for of in while new class export import from try catch throw true false null undefined type interface extends string number boolean Promise Array',
Python:'def return for in if else elif with as import from async await class None True False lambda print len range not and or is',
Go:'func return for range if else err nil var const type struct map string int bool package import go defer',
SQL:'SELECT FROM WHERE LEFT JOIN ON AS GROUP BY ORDER DESC ASC LIMIT COUNT CREATE INDEX CONCURRENTLY NOW INTERVAL INSERT INTO VALUES UPDATE SET AND OR',
Bash:'for in do done if then fi else echo export'};
function highlight(t,lang){
  const kw=new Set(KW[lang].split(' ')),out=new Array(t.length).fill('');
  const cm=lang==='Python'||lang==='Bash'?'#[^\\n]*':lang==='SQL'?'--[^\\n]*':'//[^\\n]*';
  const re=new RegExp(`(${cm})|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|\`(?:\\\\.|[^\`\\\\])*\`)|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)|([{}()\\[\\];,.:=<>|&!?+\\-*/%@])`,'g');
  let m;while(m=re.exec(t)){const c=m[1]?'c':m[2]?'s':m[3]?'n':m[4]?(kw.has(m[4])?'k':'f'):m[5]?(kw.has(m[5])?'k':''):'p';
    for(let i=m.index;i<m.index+m[0].length;i++)out[i]=c}
  return out;
}
let hl=[];
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
for(const l of Object.keys(S))$('lang').add(new Option(l,l));
$('lang').value=store.get('lang','JavaScript');
let text,pos,typed,errors,start,timer,last=-1;
function pick(){const a=S[$('lang').value];let i;do i=Math.floor(Math.random()*a.length);while(a.length>1&&i===last);last=i;return a[i]}
function reset(newText){
  if(newText||!text){text=pick();hl=highlight(text,$('lang').value)}
  pos=0;typed=[];errors=0;start=null;clearInterval(timer);
  $('result').style.display='none';render();stats();$('code').focus();
}
function render(){
  let h='';
  for(let i=0;i<text.length;i++){
    const c=text[i],cls=(hl[i]||'')+' '+(i<pos?(typed[i]?'ok':'bad'):'t');
    const ch=c==='\n'?' ':c.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    h+=`<span class="${cls}${i===pos?' cur':''}${c==='\n'?' nl':''}">${ch}</span>${c==='\n'?'\n':''}`;
  }
  if(pos>=text.length)h+='<span class="cur"> </span>';
  $('code').innerHTML=h;if(typeof showKey==='function')showKey();
  const cur=$('code').querySelector('.cur');cur&&cur.scrollIntoView({block:'nearest',inline:'nearest'});
}
function stats(){
  const sec=start?(Date.now()-start)/1000:0,ok=typed.filter(Boolean).length;
  $('wpm').textContent=sec>1?Math.round(ok/5/(sec/60)):0;
  $('acc').textContent=pos?Math.round(100*(pos-errors)/pos)+'%':'100%';
  $('time').textContent=Math.round(sec)+'s';$('err').textContent=errors;
}
function skipIndent(){while(pos<text.length&&/[ \t]/.test(text[pos])&&isIndent(pos)){typed[pos]=true;pos++}}
function isIndent(p){for(let i=p-1;i>=0;i--){if(text[i]==='\n')return true;if(text[i]!==' '&&text[i]!=='\t')return false}return true}
function finish(){
  clearInterval(timer);stats();
  const w=$('wpm').textContent,a=$('acc').textContent;
  $('rtitle').textContent=`${w} WPM · ${a}`;
  $('rtext').textContent=`${$('lang').value}, ${text.length} символов за ${$('time').textContent}`;
  $('result').style.display='block';
  const h=store.get('hist',[]);h.unshift({l:$('lang').value,w:+w,a,d:new Date().toLocaleDateString('ru')});store.set('hist',h.slice(0,50));hist();
}
function hist(){
  const h=store.get('hist',[]);if(!h.length){$('hist').textContent='';return}
  const best=Math.max(...h.map(x=>x.w)),avg=Math.round(h.slice(0,10).reduce((s,x)=>s+x.w,0)/Math.min(10,h.length));
  $('hist').textContent=`Рекорд: ${best} WPM · среднее за последние ${Math.min(10,h.length)}: ${avg} WPM · всего заходов: ${h.length}`;
}
$('code').addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){reset();return}
  if(pos>=text.length)return;
  let k=e.key;
  if(k==='Backspace'){e.preventDefault();if(pos>0){pos--;while(pos>0&&/[ \t]/.test(text[pos])&&isIndent(pos))pos--;typed.length=pos;render();stats()}return}
  if(k==='Tab'){e.preventDefault();return}
  if(k==='Enter')k='\n';
  if(k.length!==1)return;
  e.preventDefault();
  if(!start){start=Date.now();timer=setInterval(stats,500)}
  const good=k===text[pos];typed[pos]=good;if(!good)errors++;pos++;
  if(good&&k==='\n')skipIndent();
  render();stats();
  if(pos>=text.length)finish();
});
$('code').addEventListener('click',()=>$('code').focus());
$('next').onclick=()=>reset(true);$('again').onclick=()=>reset(true);
$('lang').onchange=()=>{store.set('lang',$('lang').value);last=-1;reset(true)};

const FC={L5:'#ff7eb6',L4:'#ffb86c',L3:'#ffd23f',L2:'#7ee787',T:'#9aa0a6',R2:'#4fd1c5',R3:'#82aaff',R4:'#c792ea',R5:'#ff6e6e'};
const FN={L5:'левый мизинец',L4:'левый безымянный',L3:'левый средний',L2:'левый указательный',T:'большой палец',R2:'правый указательный',R3:'правый средний',R4:'правый безымянный',R5:'правый мизинец'};
const ROWS=[
 [['`~','L5'],['1!','L5'],['2@','L4'],['3#','L3'],['4$','L2'],['5%','L2'],['6^','R2'],['7&','R2'],['8*','R3'],['9(','R4'],['0)','R5'],['-_','R5'],['=+','R5']],
 [['q','L5'],['w','L4'],['e','L3'],['r','L2'],['t','L2'],['y','R2'],['u','R2'],['i','R3'],['o','R4'],['p','R5'],['[{','R5'],[']}','R5'],['\\|','R5']],
 [['a','L5'],['s','L4'],['d','L3'],['f','L2'],['g','L2'],['h','R2'],['j','R2'],['k','R3'],['l','R4'],[';:','R5'],["'\"",'R5'],['\n','R5','Enter','w2']],
 [['LS','L5','Shift','w25'],['z','L5'],['x','L4'],['c','L3'],['v','L2'],['b','L2'],['n','R2'],['m','R2'],[',<','R3'],['.>','R4'],['/?','R5'],['RS','R5','Shift','w25']],
 [[' ','T','','sp']]];
const KEYMAP={};
ROWS.forEach(r=>r.forEach(([k,f,label,w])=>{
  const el=document.createElement('div');el.className='key'+(w?' '+w:'')+(/^[fj]$/.test(k)?' home':'');el.style.setProperty('--fc',FC[f]);
  el.textContent=label??(k.length===2&&!/[a-z]/.test(k)?k[0]+' '+k[1]:k.toUpperCase());
  const info={el,f};
  if(k==='LS'||k==='RS')KEYMAP[k]=info;
  else if(k.length===1||k==='\n'){KEYMAP[k]=info;if(/[a-z]/.test(k))KEYMAP[k.toUpperCase()]={...info,shift:true}}
  else if(k.length===2){KEYMAP[k[0]]=info;KEYMAP[k[1]]={...info,shift:true}}
  else KEYMAP[k]=info;
  r.el=r.el||document.createElement('div');r.el.className='row';r.el.appendChild(el);
}));
ROWS.forEach(r=>$('kb').appendChild(r.el));
const FINGERS={};
[['L5','L4','L3','L2','T'],['T','R2','R3','R4','R5']].forEach((h,hi)=>{const d=document.createElement('div');d.className='hand';
  h.forEach((f,i)=>{const e=document.createElement('div');e.className='fg';e.style.setProperty('--fc',FC[f]);e.style.height=(f==='T'?26:{L5:40,L4:54,L3:62,L2:56,R2:56,R3:62,R4:54,R5:40}[f])+'px';
    if(f==='T'){e.style.width='26px';e.style.marginLeft=hi?'0':'4px';e.style.marginRight=hi?'4px':'0'}
    (FINGERS[f+hi]=e);d.appendChild(e)});$('hands').appendChild(d)});
function fingerEl(f){return f==='T'?[FINGERS.T0,FINGERS.T1]:[FINGERS[f+(f[0]==='L'?0:1)]]}
function showKey(){
  document.querySelectorAll('#kb .on,#hands .on').forEach(e=>e.classList.remove('on'));
  if(!text||pos>=text.length){$('finger').textContent='';return}
  const k=KEYMAP[text[pos]];if(!k){$('finger').textContent='';return}
  k.el.classList.add('on');fingerEl(k.f).forEach(e=>e&&e.classList.add('on'));
  let msg=FN[k.f];
  if(k.shift){const sh=k.f[0]==='L'?'RS':'LS',si=KEYMAP[sh];si.el.classList.add('on');fingerEl(si.f).forEach(e=>e.classList.add('on'));msg+=' + Shift '+FN[si.f].replace('мизинец','мизинцем').replace(/^(\S+)ый/,'$1ым').replace(/^(\S+)ий/,'$1им')}
  $('finger').innerHTML=`<span style="color:${FC[k.f]}">●</span> ${msg}`;
}
$('kbtoggle').onclick=()=>{const v=$('kbwrap').style.display==='none';$('kbwrap').style.display=v?'':'none';store.set('kb',v);$('code').focus()};
if(store.get('kb',true)===false)$('kbwrap').style.display='none';
reset(true);hist();
</script>
</body>
</html>
